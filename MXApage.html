    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" src="" alt="Full-size image">

   <script>
let images = []; // Store all images
let currentIndex = 0;

// Get all images from .first and .image-gallery
document.querySelectorAll('.first img, .image-gallery img').forEach((img, index) => {
    images.push(img.src); // Store image sources
    img.addEventListener('click', function() {
        openLightbox(index);
    });
});

// Open Lightbox
function openLightbox(index) {
    currentIndex = index;
    document.getElementById('lightbox-img').src = images[currentIndex];
    document.getElementById('lightbox').style.display = 'flex';
}

// Close Lightbox
function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
}

// Navigate Images
function changeImage(direction) {
    currentIndex += direction;
    if (currentIndex < 0) {
        currentIndex = images.length - 1; // Go to last image if at the start
    } else if (currentIndex >= images.length) {
        currentIndex = 0; // Loop back to first image
    }
    document.getElementById('lightbox-img').src = images[currentIndex];
}
</script>
